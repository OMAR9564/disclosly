# Model providers per task class (contracts/model-router.md). Model ids appear only here.
# daily_requests: free-tier request quota per UTC day (placeholders; owner checks the
# current free-tier limits before launch). price_per_mtok: USD reference price, used only
# for the would-have-cost telemetry attribute.
# Model ids checked against each provider's live model list on 2026-10-22: Gemini and Groq
# list endpoints, OpenRouter's free models with tool support; each answered a tool call.
# Groq allows 8,000 tokens per minute per model on the free tier, so a large final request
# gets 413 there and moves on to the next provider without a cooldown.
# GitHub Models was retired on 2026-07-30 (its endpoint answers "OK" as plain text), so it is gone.
classes:
  cheap: [gemini-flash-lite, groq-llama, groq-qwen, openrouter-free, cloudflare]
  strong: [gemini-flash-stable, gemini-flash, nvidia-large, openrouter-large, groq-large]
providers:
  gemini-flash-lite:
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    model: gemini-3.5-flash-lite
    api_key_env: GEMINI_API_KEY
    daily_requests: 1000
    native_tools: true
    price_per_mtok: {input: 0.10, output: 0.40}
  gemini-flash:
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    model: gemini-3.8-flash
    api_key_env: GEMINI_API_KEY
    daily_requests: 250
    native_tools: true
    price_per_mtok: {input: 0.30, output: 2.50}
  # First in `strong`: answers in about 1 s, while the 3.x flash models took 10-15 s and
  # often returned 503 (measured 2026-10-22); the client timeout is 15 s.
  gemini-flash-stable:
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    model: gemini-2.5-flash
    api_key_env: GEMINI_API_KEY
    daily_requests: 250
    native_tools: true
    price_per_mtok: {input: 0.30, output: 2.50}
  groq-llama:
    base_url: https://api.groq.com/openai/v1
    model: openai/gpt-oss-20b
    api_key_env: GROQ_API_KEY
    daily_requests: 1000
    native_tools: true
    price_per_mtok: {input: 0.05, output: 0.08}
  groq-qwen:
    base_url: https://api.groq.com/openai/v1
    model: qwen/qwen3.8-27b
    api_key_env: GROQ_API_KEY
    daily_requests: 1000
    native_tools: true
    price_per_mtok: {input: 0.29, output: 0.59}
  groq-large:
    base_url: https://api.groq.com/openai/v1
    model: openai/gpt-oss-120b
    api_key_env: GROQ_API_KEY
    daily_requests: 1000
    native_tools: true
    price_per_mtok: {input: 0.15, output: 0.60}
  # OpenRouter free models share 50 requests per day per account (without credits).
  openrouter-free:
    base_url: https://openrouter.ai/api/v1
    model: minimax/minimax-m3.1-flash:free
    api_key_env: OPENROUTER_API_KEY
    daily_requests: 25
    native_tools: true
    price_per_mtok: {input: 0.0, output: 0.0}
  openrouter-large:
    base_url: https://openrouter.ai/api/v1
    model: nvidia/nemotron-3-ultra-550b-a55b:free
    api_key_env: OPENROUTER_API_KEY
    daily_requests: 25
    native_tools: true
    price_per_mtok: {input: 0.0, output: 0.0}
  # NVIDIA's hosted NIM endpoints (build.nvidia.com): free for development, about 40
  # requests per minute (community-measured; NVIDIA publishes no number). Answered the report
  # schema and a tool call in about 10 s on 2026-10-25; several listed models return 404 for
  # a new key. Production use needs NVIDIA AI Enterprise: owner checks the terms first.
  # A plan took 27 s on 2026-10-26, so the 15 s default timed out every deep call.
  nvidia-large:
    base_url: https://integrate.api.nvidia.com/v1
    model: nvidia/nemotron-3-ultra-550b-a55b
    api_key_env: NVIDIA_API_KEY
    daily_requests: 1000
    native_tools: true
    price_per_mtok: {input: 0.0, output: 0.0}
    timeout_seconds: 60
  cloudflare:
    base_url: https://api.cloudflare.com/client/v4/accounts/{CLOUDFLARE_ACCOUNT_ID}/ai/v1
    model: "@cf/meta/llama-4-scout-17b-16e-instruct"
    api_key_env: CLOUDFLARE_AI_TOKEN
    daily_requests: 1000
    native_tools: false
    price_per_mtok: {input: 0.27, output: 0.85}
