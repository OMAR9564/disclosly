#cloud-config
# First-boot setup for the API server (research.md R9). Rendered by templatefile() in main.tf.

package_update: true
package_upgrade: true
packages:
  - ca-certificates
  - curl
  - unattended-upgrades

users:
  - name: deploy
    shell: /bin/bash
    lock_passwd: true
    ssh_authorized_keys:
%{ for key in deploy_authorized_keys ~}
      - ${key}
%{ endfor ~}

write_files:
  - path: /etc/ssh/sshd_config.d/99-disclosly.conf
    permissions: "0644"
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
  - path: /etc/sysctl.d/99-disclosly-swap.conf
    permissions: "0644"
    content: |
      vm.swappiness=10
  - path: /etc/apt/apt.conf.d/20auto-upgrades
    permissions: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

runcmd:
  # Docker Engine and the Compose plugin from Docker's apt repository.
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - >-
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc]
    https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable"
    > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - usermod -aG docker deploy
  - systemctl enable --now docker
  # 4 GB swap file, persisted in /etc/fstab.
  - fallocate -l 4G /swapfile
  - chmod 600 /swapfile
  - mkswap /swapfile
  - swapon /swapfile
  - echo '/swapfile none swap sw 0 0' >> /etc/fstab
  - sysctl --system
  # Unattended security upgrades.
  - systemctl enable --now unattended-upgrades
  # Deploy workspace (deploy.sh keeps the previous image tag in .deploy/).
  - install -d -o deploy -g deploy -m 0750 /home/deploy/disclosly /home/deploy/disclosly/.deploy
  - systemctl restart ssh
