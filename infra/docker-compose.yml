# Production stack (PROJECT_SPEC.md §16.1). Values come from the `.env` file next to this file
# on the server (contract: specs/001-walking-skeleton/contracts/configuration.md).
# Local development adds docker-compose.dev.yml on top (see Makefile).

x-api-environment: &api-environment
  APP_ENV: ${APP_ENV:?APP_ENV is required}
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  # Session signing key; api.config requires it (32+ characters) outside development and test.
  JWT_SECRET: ${JWT_SECRET:-}
  # Model provider keys (llm/providers.yaml); a provider whose key is empty is skipped.
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
  CLOUDFLARE_AI_TOKEN: ${CLOUDFLARE_AI_TOKEN:-}
  # Sign-in (research §R4). An empty OAuth pair turns that provider off; an empty Turnstile
  # secret makes every sign-in fail the bot check.
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
  GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
  TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
  WEB_ORIGIN: ${WEB_ORIGIN:-https://disclosly.com}
  API_ORIGIN: ${API_ORIGIN:-https://api.disclosly.com}
  SESSION_COOKIE_DOMAIN: ${SESSION_COOKIE_DOMAIN:-.disclosly.com}
  # Only Caddy sits on the edge network, so only it may set the client IP (CF-Connecting-IP).
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.30.0.0/24}
  # Quotas, rate limits and agent budget; unset means the API defaults.
  QUOTA_DAILY_QUESTIONS: ${QUOTA_DAILY_QUESTIONS:-20}
  RATE_LIMIT_USER_PER_MIN: ${RATE_LIMIT_USER_PER_MIN:-30}
  RATE_LIMIT_IP_PER_MIN: ${RATE_LIMIT_IP_PER_MIN:-60}

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    mem_limit: 64m
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
    depends_on:
      - api

  api:
    image: ghcr.io/omar9564/disclosly-api:${API_IMAGE_TAG:?API_IMAGE_TAG is required}
    restart: unless-stopped
    mem_limit: 512m
    environment: *api-environment
    networks:
      - default
      - edge
    tmpfs:
      - /tmp/prometheus
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    mem_limit: 1g
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=8MB
      - -c
      - max_connections=40
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 160m
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Background jobs: ingestion, OCR and small-batch embedding (arq). deploy.sh does not touch
  # it; the image is built by CI (workers/Dockerfile). Its variables are optional here, because
  # a missing required variable fails the whole file and with it every API deploy. The worker
  # itself stops at startup when SEC_USER_AGENT is empty or has no contact address.
  worker:
    image: ghcr.io/omar9564/disclosly-worker:${WORKER_IMAGE_TAG:-main}
    restart: unless-stopped
    mem_limit: 768m
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      SEC_USER_AGENT: ${SEC_USER_AGENT:-}
      INGEST_DATA_DIR: /data/ingest
      CORPUS_DISK_LIMIT_GB: ${CORPUS_DISK_LIMIT_GB:-20}
      RETRIEVAL_CHUNKER_VERSION: ${RETRIEVAL_CHUNKER_VERSION:-v1-600-64}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-intfloat/multilingual-e5-small}
      RERANK_MODEL: ${RERANK_MODEL:-cross-encoder/mmarco-mMiniLMv2-L12-H384-v1}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ingest_data:/data/ingest
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Document search for the API (workers/search.py, queue `arq:search`). Same image as the
  # worker; it loads the embedding and rerank models once, so the API image stays model-free.
  # A separate container keeps searches from waiting behind a long ingestion job.
  search:
    image: ghcr.io/omar9564/disclosly-worker:${WORKER_IMAGE_TAG:-main}
    restart: unless-stopped
    # Measured ~1.1 GiB idle with both models (2026-10-21); 1.5g leaves room for a query batch.
    mem_limit: 1536m
    command: ["arq", "workers.search.SearchWorkerSettings"]
    healthcheck:
      test: ["CMD", "arq", "--check", "workers.search.SearchWorkerSettings"]
      interval: 60s
      timeout: 10s
      start_period: 90s
      retries: 3
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      RETRIEVAL_CHUNKER_VERSION: ${RETRIEVAL_CHUNKER_VERSION:-v1-600-64}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-intfloat/multilingual-e5-small}
      RERANK_MODEL: ${RERANK_MODEL:-cross-encoder/mmarco-mMiniLMv2-L12-H384-v1}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # One-off: `docker compose --profile migrate run --rm migrate` (infra/scripts/deploy.sh).
  # Alembic owns schema `public`; the graph checkpoint tables go to `agent_graph` (agent/checkpoint.py).
  migrate:
    image: ghcr.io/omar9564/disclosly-api:${API_IMAGE_TAG:?API_IMAGE_TAG is required}
    profiles: ["migrate"]
    mem_limit: 256m
    environment: *api-environment
    command: ["sh", "-c", "alembic upgrade head && python -m agent.checkpoint setup"]
    depends_on:
      postgres:
        condition: service_healthy

# `edge` joins Caddy and the API only; its fixed subnet is what TRUSTED_PROXIES names.
networks:
  edge:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  ingest_data:
