[project]
name = "disclosly"
version = "0.1.0"
description = "Multi-agent research platform over company disclosures with cited answers."
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "arq>=0.25.0",
    "cryptography>=50.0.2",
    "fastapi>=0.143.3",
    "httpx>=0.28.1",
    "opentelemetry-api>=1.45.1",
    "pgvector>=0.5.1",
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "pypdf>=6.21.1",
    "pytesseract>=0.3.13",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
    "selectolax>=1.0.1",
    "sqlalchemy>=2.1.5",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
include = ["*.py", "*.pyi"]
extend-exclude = [".claude", ".specify"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF"]
# Turkish letters in KAP labels and fixtures are not confusables.
allowed-confusables = ["ı", "İ"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
packages = ["api", "evals", "ingestion", "retrieval", "workers", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pytesseract", "transformers", "sentence_transformers", "arq.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: needs real Postgres and Redis services"]
addopts = "--strict-markers --cov=api --cov=evals --cov=ingestion --cov=retrieval --cov=workers --cov-report=term-missing --cov-fail-under=80"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
    "types-pyyaml>=6.0.12.20260906",
]
ml = [
    "sentence-transformers>=5.0.0",
    "torch>=2.8.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
