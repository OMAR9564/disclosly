name: Deploy

# Runs only after the CI workflow succeeds for a push to main (research.md R7, R10).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
  API_IMAGE: ghcr.io/omar9564/disclosly-api
  API_BASE_URL: https://api.disclosly.com
  VERCEL_CLI_VERSION: 64.5.0

jobs:
  api:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: api/Dockerfile
          push: true
          build-args: APP_VERSION=${{ env.HEAD_SHA }}
          tags: |
            ${{ env.API_IMAGE }}:${{ env.HEAD_SHA }}
            ${{ env.API_IMAGE }}:main
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
      - name: Copy deploy files
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: >-
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes
          infra/docker-compose.yml infra/Caddyfile infra/scripts/deploy.sh
          "deploy@${DEPLOY_HOST}:~/disclosly/"
      - name: Run deploy.sh (rolls back on failed health check)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: >-
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "deploy@${DEPLOY_HOST}"
          "bash ~/disclosly/deploy.sh ${HEAD_SHA}"
      - name: Check /healthz version
        run: |
          version="$(curl -fsS --retry 5 --retry-delay 3 --retry-all-errors "${API_BASE_URL}/healthz" \
            | sed -n 's/.*"version":"\([^"]*\)".*/\1/p')"
          echo "live version: ${version}"
          test "${version}" = "${HEAD_SHA}"

  web:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      NEXT_PUBLIC_API_BASE_URL: https://api.disclosly.com
      NEXT_PUBLIC_APP_VERSION: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
      # The Vercel project's root directory is web/, so the CLI runs from the repository root.
      - run: npx --yes "vercel@${VERCEL_CLI_VERSION}" pull --yes --environment=production --token="$VERCEL_TOKEN"
      - run: npx --yes "vercel@${VERCEL_CLI_VERSION}" build --prod --token="$VERCEL_TOKEN"
      - run: npx --yes "vercel@${VERCEL_CLI_VERSION}" deploy --prebuilt --prod --token="$VERCEL_TOKEN"
