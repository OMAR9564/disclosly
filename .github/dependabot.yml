# Ecosystems are added by the task that creates their manifest
# (github-actions: T008, docker: T013, terraform: T020), because Dependabot
# fails with dependency_file_not_found when a directory has no manifest.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      # react and react-dom must have the exact same version; separate PRs always fail.
      react:
        patterns:
          - react
          - react-dom
    ignore:
      # Types must match the Node.js 24 runtime (web/.nvmrc, engines).
      - dependency-name: "@types/node"
        versions: [">=25"]
      # plan.md pins TypeScript 5.x; a major upgrade needs a spec change first.
      - dependency-name: typescript
        versions: [">=6"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /api
    schedule:
      interval: weekly
    ignore:
      # The image must match .python-version (3.12); other versions break `uv sync`.
      - dependency-name: python
        versions: [">=3.13"]
